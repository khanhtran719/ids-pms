<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>IDS PMS — Quản trị Dự án Hạ tầng số</title>
<script src="https://cdn.tailwindcss.com"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>
<style>
/* ============================================================
   HỆ MÀU — 3 nhóm tách bạch, không bao giờ dùng chéo:
   1) Bề mặt & mực  2) Series (identity)  3) Status (state)
   ============================================================ */
:root{
  /* bề mặt & mực — trung tính ấm, không ám xanh */
  --plane:#f4f4f1; --page:#f9f9f7; --surface:#fcfcfb;
  --ink:#0b0b0b; --ink-2:#52514e; --ink-3:#898781;
  --grid:#e1e0d9; --axis:#c3c2b7; --hair:rgba(11,11,11,.10);
  /* series — thứ tự cố định, không đảo, không lặp */
  --s1:#2a78d6; --s2:#eb6834; --s3:#1baf7a; --s4:#eda100; --s7:#4a3aa7;
  --neutral:#c3c2b7;
  /* status — bộ riêng, không dùng làm màu series */
  --good:#0ca30c; --warn:#fab219; --critical:#d03b3b;
  --good-ink:#006300; --warn-ink:#8a5a00; --bad-ink:#9b2020;
  --accent:var(--s1);
}
*{border-color:var(--hair)}
body{font-family:system-ui,-apple-system,'Segoe UI',sans-serif;background:var(--page);color:var(--ink);
  -webkit-font-smoothing:antialiased;-moz-osx-font-smoothing:grayscale}
::-webkit-scrollbar{width:10px;height:10px}
::-webkit-scrollbar-track{background:transparent}
::-webkit-scrollbar-thumb{background:#dcdbd4;border-radius:6px;border:3px solid var(--page)}
::-webkit-scrollbar-thumb:hover{background:var(--axis)}

/* ---------- bề mặt ---------- */
.card{background:var(--surface);border-radius:10px;
  box-shadow:0 0 0 1px var(--hair),0 1px 2px rgba(11,11,11,.035)}
.card-flat{background:var(--surface);border-radius:9px;box-shadow:0 0 0 1px var(--hair)}
.well{background:var(--page);border-radius:8px;box-shadow:inset 0 0 0 1px var(--hair)}
.dark-panel{background:#1a1a19;color:#f4f4f1;border-radius:10px}
.dark-panel .dim{color:#c3c2b7}

/* ---------- sidebar sáng ---------- */
.side{background:var(--plane);border-right:1px solid var(--hair)}
.nav-item{position:relative;padding:7px 12px;margin:1px 10px;border-radius:7px;
  color:var(--ink-2);transition:background .12s ease,color .12s ease}
.nav-item:hover{background:rgba(11,11,11,.045);color:var(--ink)}
.nav-item.active{background:var(--surface);color:var(--ink);font-weight:600;
  box-shadow:0 0 0 1px var(--hair),0 1px 2px rgba(11,11,11,.05)}
.nav-item.active::before{content:'';position:absolute;left:-10px;top:50%;transform:translateY(-50%);
  width:2px;height:18px;border-radius:1px;background:var(--accent)}

/* ---------- KPI ---------- */
.k-label{font-size:11.5px;color:var(--ink-3)}
.k-value{font-size:26px;line-height:1.15;font-weight:600;margin-top:6px;letter-spacing:-.022em;color:var(--ink)}
.k-sub{font-size:11.5px;color:var(--ink-3);margin-top:5px;min-height:1em}
.v-good{color:var(--good-ink)} .v-warn{color:var(--warn-ink)} .v-bad{color:var(--bad-ink)}

/* ---------- trạng thái: chấm + nhãn, không bao giờ là khối màu ---------- */
.st{display:inline-flex;align-items:center;gap:6px;font-size:12px;color:var(--ink-2);white-space:nowrap}
.st i{width:6px;height:6px;border-radius:50%;flex:none}
.tag{display:inline-flex;align-items:center;gap:5px;font-size:11px;color:var(--ink-2);
  border:1px solid var(--hair);border-radius:5px;padding:1px 7px;background:var(--page);white-space:nowrap}
.tag i{width:5px;height:5px;border-radius:50%;flex:none}

/* ---------- bảng ---------- */
table{border-collapse:collapse}
thead th{font-weight:500;font-size:11.5px;color:var(--ink-3);letter-spacing:.015em;
  background:var(--page);border-bottom:1px solid var(--hair)}
tbody tr{border-top:1px solid var(--hair)}
tbody tr:first-child{border-top:0}
tbody tr:hover{background:rgba(11,11,11,.022)}
td.text-right,th.text-right,td.text-center,.num{font-variant-numeric:tabular-nums}
.mono{font-family:ui-monospace,'Cascadia Mono',Consolas,monospace;font-size:11.5px;color:var(--ink-2)}
.missing{color:var(--warn-ink)}
.step{width:22px;height:22px;border-radius:50%;background:var(--page);color:var(--ink-3);
  box-shadow:inset 0 0 0 1px var(--hair);font-size:11px;
  display:flex;align-items:center;justify-content:center;flex:none}

/* ---------- callout: viền trái mảnh thay cho nền pastel ---------- */
.note{border-radius:9px;padding:15px 18px;font-size:13.5px;line-height:1.6;color:var(--ink-2);
  background:var(--surface);box-shadow:0 0 0 1px var(--hair);border-left:2px solid var(--ink-3)}
.note strong{color:var(--ink);font-weight:600}
.note h3{color:var(--ink)}
.note-bad{border-left-color:var(--critical)}
.note-warn{border-left-color:var(--warn)}
.note-info{border-left-color:var(--accent)}

/* ---------- điều khiển ---------- */
.ctl{background:var(--surface);border:1px solid var(--hair);border-radius:7px;padding:6px 10px;
  font-size:13px;color:var(--ink);outline:none;transition:border-color .12s,box-shadow .12s}
.ctl:focus{border-color:var(--accent);box-shadow:0 0 0 3px rgba(42,120,214,.13)}
.ctl::placeholder{color:var(--ink-3)}

/* ---------- phụ ---------- */
.muted{color:var(--ink-3)} .muted-2{color:var(--ink-2)}
.h3{font-size:13px;font-weight:600;color:var(--ink)}
.meter{height:5px;border-radius:3px;background:var(--grid);overflow:hidden}
.meter>div{height:100%;border-radius:3px}
/* khung biểu đồ cao cố định — mọi card cùng hàng bằng nhau, không còn khoảng trắng thừa */
.cbox{position:relative;height:300px}
</style>
</head>
<body>
<div class="flex h-screen">

<aside class="side w-60 flex flex-col shrink-0">
  <div class="px-5 pt-5 pb-4">
    <div class="font-semibold text-[15px] tracking-tight">IDS <span style="color:var(--accent)">PMS</span></div>
    <div class="text-[11px] muted mt-0.5">Quản trị dự án hạ tầng số</div>
  </div>
  <nav class="flex-1 overflow-y-auto" id="nav">
    <a data-p="dash" class="nav-item active flex items-center text-[13px] cursor-pointer">Tổng quan</a>
    <a data-p="proj" class="nav-item flex items-center text-[13px] cursor-pointer">Dự án</a>
    <a data-p="task" class="nav-item flex items-center text-[13px] cursor-pointer">Tiến độ thi công</a>
    <a data-p="carrier" class="nav-item flex items-center text-[13px] cursor-pointer">Hợp đồng nhà mạng</a>
    <a data-p="rev" class="nav-item flex items-center text-[13px] cursor-pointer">Doanh thu</a>
    <a data-p="debt" class="nav-item flex items-center text-[13px] cursor-pointer">Công nợ</a>
    <a data-p="payback" class="nav-item flex items-center text-[13px] cursor-pointer">Hoàn vốn</a>
    <a data-p="crm" class="nav-item flex items-center text-[13px] cursor-pointer">Cơ hội kinh doanh</a>
    <a data-p="quality" class="nav-item flex items-center text-[13px] cursor-pointer">Chất lượng dữ liệu</a>
  </nav>
  <div class="px-5 py-4 text-[11px] muted" style="border-top:1px solid var(--hair)">
    <div class="muted-2 font-medium">Ban Tổng Giám đốc</div>
    <div class="mt-0.5">Dữ liệu thật · FY2025</div>
  </div>
</aside>

<main class="flex-1 flex flex-col min-w-0 min-h-0">
  <header class="shrink-0 px-7 py-3.5 flex justify-between items-center"
          style="background:var(--page);border-bottom:1px solid var(--hair)">
    <div><h1 id="ttl" class="text-[17px] font-semibold tracking-tight">Tổng quan</h1>
    <p id="sub" class="text-[11.5px] muted mt-0.5"></p></div>
    <div class="text-[11.5px] muted num">06/08/2026</div>
  </header>
  <div id="body" class="flex-1 min-h-0 p-7 overflow-y-auto"></div>
</main>
</div>

<div id="modal" class="hidden fixed inset-0 z-50 flex items-center justify-center p-6"
     style="background:rgba(11,11,11,.45)" onclick="if(event.target===this)close_()">
  <div class="rounded-xl max-w-4xl w-full max-h-[88vh] overflow-y-auto"
       style="background:var(--surface);box-shadow:0 10px 44px rgba(11,11,11,.20),0 0 0 1px var(--hair)">
    <div class="px-6 py-4 flex justify-between items-start sticky top-0"
         style="background:var(--surface);border-bottom:1px solid var(--hair)">
      <div><h3 id="mt" class="font-semibold tracking-tight"></h3><p id="ms" class="text-[11.5px] muted mt-1"></p></div>
      <button onclick="close_()" class="muted text-xl leading-none" style="transition:color .12s"
              onmouseover="this.style.color='var(--ink)'" onmouseout="this.style.color=''">&times;</button>
    </div>
    <div id="mb" class="px-6 py-5"></div>
  </div>
</div>

      <option value="">Tất cả trạng thái</option>${Object.entries(ST).map(([k,v])=>`<option value="${k}">${v[0]}</option>`).join('')}</select>
    <select id="fc" onchange="rp()" class="ctl">
      <option value="">Tất cả</option><option value="1">Có doanh thu</option><option value="2">Thiếu CPĐT</option><option value="3">Dữ liệu xung đột</option></select>
  </div>
  <div class="card overflow-hidden"><table class="w-full text-sm">
  <thead><tr>
    <th class="text-left px-4 py-2.5">Mã DA</th><th class="text-left px-4 py-2.5">Tên dự án</th>
    <th class="text-left px-4 py-2.5">Chủ đầu tư</th><th class="text-left px-4 py-2.5">Tỉnh</th>
    <th class="text-right px-4 py-2.5">Số CH</th><th class="text-right px-4 py-2.5">m² sàn</th>
    <th class="text-center px-4 py-2.5">HĐ NM</th><th class="text-right px-4 py-2.5">Doanh thu</th>
    <th class="text-left px-4 py-2.5">Trạng thái</th></tr></thead>
  <tbody id="pt"></tbody></table></div>`});

function rp(){
  const q=(document.getElementById('fq').value||'').toLowerCase(), s=document.getElementById('fs').value, f=document.getElementById('fc').value;
  let r=P.filter(p=>(!q||p.name.toLowerCase().includes(q)||(p.investor||'').toLowerCase().includes(q))&&(!s||p.status===s));
  if(f==='1')r=r.filter(p=>p.revTotal>0); if(f==='2')r=r.filter(p=>!p.capex); if(f==='3')r=r.filter(p=>p.conflict);
  document.getElementById('pt').innerHTML=r.map(p=>`<tr class="cursor-pointer" onclick="pd('${p.id}')">
    <td class="px-4 py-2.5 mono ${p.code?'':'missing'}">${p.code||'thiếu'}</td>
    <td class="px-4 py-2.5 font-medium">${p.name}${p.conflict?' <span class="missing" title="Dữ liệu từ nhiều sheet">◆</span>':''}</td>
    <td class="px-4 py-2.5 muted-2 text-xs">${(p.investor||'—').slice(0,38)}</td>
    <td class="px-4 py-2.5 muted-2">${p.province||'—'}</td>
    <td class="px-4 py-2.5 text-right">${fmt(p.units)}</td><td class="px-4 py-2.5 text-right">${fmt(p.m2)}</td>
    <td class="px-4 py-2.5 text-center">${p.carriers.length||'—'}</td>
    <td class="px-4 py-2.5 text-right ${p.revTotal?'font-medium':'muted'}">${p.revTotal?bil(p.revTotal):'—'}</td>
    <td class="px-4 py-2.5">${badge(...ST[p.status])}</td></tr>`).join('')
    ||'<tr><td colspan="9" class="text-center py-8 muted">Không có dự án nào khớp</td></tr>';
}

function pd(id){
  const p=P.find(x=>x.id===id), tk=T.filter(t=>t.pkey===p.key);
  const roi=p.capex?p.revTotal/p.capex:null;
  open_(p.name, (p.code||'chưa có mã')+' · '+(p.province||'—')+' · nguồn: '+[...new Set(p.sources)].join(', '), `
  <div class="grid grid-cols-4 gap-3 mb-5">
    ${card('Quy mô',fmt(p.units)+' CH','—')}${card('Diện tích sàn',fmt(p.m2)+' m²','—')}
    ${card('Doanh thu FY2025',p.revTotal?bil(p.revTotal):'—','')}${card('Tổng CPĐT',p.capex?bil(p.capex):'chưa có',p.capex?'':'không đánh giá được hoàn vốn',p.capex?'':'v-bad')}
  </div>
  ${p.conflict?'<div class="note note-warn mb-5">Dự án này xuất hiện ở nhiều sheet Excel khác nhau. Trong hệ thống mới đã hợp nhất thành một bản ghi duy nhất.</div>':''}
  <div class="mb-5"><h4 class="h3 mb-2">Chủ đầu tư</h4>
    <div class="text-sm muted-2 well p-3">${p.investor||'—'}</div></div>
  ${p.scale?`<div class="mb-5"><h4 class="h3 mb-2">Quy mô mô tả</h4><div class="text-sm muted-2 well p-3 whitespace-pre-line">${p.scale}</div></div>`:''}
  <div class="mb-5"><h4 class="h3 mb-2">Hợp đồng khai thác nhà mạng (${p.carriers.length})</h4>
  ${p.carriers.length?`<div class="card-flat overflow-hidden"><table class="w-full text-sm"><thead><tr>
    <th class="text-left px-3 py-2">Nhà mạng</th><th class="text-left px-3 py-2">Dịch vụ</th>
    <th class="text-right px-3 py-2">Khối lượng</th><th class="text-right px-3 py-2">Tỷ lệ thâm nhập</th>
    <th class="text-left px-3 py-2">Điều khoản</th></tr></thead><tbody>
    ${p.carriers.map(c=>{const base=c.svc==='TELDATA'?p.units:p.m2;
    return `<tr><td class="px-3 py-2 font-medium">${c.carrier}</td>
    <td class="px-3 py-2">${tag(c.svc,c.svc==='IBS'?C.s7:C.s1)}</td>
    <td class="px-3 py-2 text-right">${fmt(c.qty)} ${c.unit}</td>
    <td class="px-3 py-2 text-right">${base?pc(c.qty/base):'—'}</td>
    <td class="px-3 py-2 missing text-xs">chưa có đơn giá</td></tr>`}).join('')}</tbody></table></div>`
    :'<div class="text-sm muted well p-3">Chưa có hợp đồng nhà mạng</div>'}</div>
  <div class="mb-5"><h4 class="h3 mb-2">Tiến độ 5 bước</h4>
  ${tk.length?`<div class="space-y-1.5">${[1,2,3,4,5].map(s=>{const t=tk.find(x=>x.step===s);
    return `<div class="flex items-center gap-3 text-sm card-flat px-3 py-2">
    <span class="step">${s}</span>
    <span class="flex-1">${['Hồ sơ thiết kế phê duyệt','Chuẩn bị vật tư, pháp lý, mặt bằng','Tổ chức thi công','Kết nối nhà mạng CĐBR/IBS','Bàn giao đưa vào VHKT'][s-1]}</span>
    ${t?`<span class="text-xs muted">${t.dept}</span>${badge(...TS[t.status])}
       <span class="text-xs ${t.actualEnd?'muted num':'missing'}">${t.actualEnd||'chưa có ngày KT thật'}</span>`
      :'<span class="text-xs muted">chưa lập</span>'}</div>`}).join('')}</div>`
    :'<div class="note note-bad">Dự án chưa có kế hoạch triển khai. Hệ thống mới sẽ tự sinh 5 bước ngay khi duyệt đầu tư.</div>'}</div>
  ${p.rev?`<div><h4 class="h3 mb-2">Doanh thu và chi phí theo quý (FY2025)</h4>
  <div class="card-flat overflow-hidden"><table class="w-full text-sm"><thead><tr><th class="text-left px-3 py-2">Kỳ</th>
  <th class="text-right px-3 py-2">Doanh thu</th><th class="text-right px-3 py-2">Chi phí</th><th class="text-right px-3 py-2">Lợi nhuận</th></tr></thead><tbody>
  ${p.rev.map((v,i)=>`<tr><td class="px-3 py-2">Quý ${i+1}/2025</td>
  <td class="px-3 py-2 text-right">${fmt(v)}</td><td class="px-3 py-2 text-right muted-2">${fmt(p.cost[i])}</td>
  <td class="px-3 py-2 text-right ${v-p.cost[i]>=0?'':'v-bad'}">${fmt(v-p.cost[i])}</td></tr>`).join('')}
  <tr class="font-medium" style="background:var(--page)"><td class="px-3 py-2">Tổng</td><td class="px-3 py-2 text-right">${fmt(p.revTotal)}</td>
  <td class="px-3 py-2 text-right muted-2">${fmt(p.costTotal)}</td><td class="px-3 py-2 text-right">${fmt(p.revTotal-p.costTotal)}</td></tr></tbody></table></div>
  ${roi?`<div class="mt-3 text-sm ${roi>1?'v-good':'v-warn'}">Tỷ lệ hoàn vốn: ${pc(roi)} — ${roi>1?'đã hoàn vốn':'chưa hoàn vốn'}</div>`:''}</div>`:''}`);
}

PAGES.task=()=>{
  const g={}; T.forEach(t=>(g[t.project]=g[t.project]||[]).push(t));
  const done=T.filter(t=>t.status==='DONE').length, withEnd=T.filter(t=>t.actualEnd).length;
  return {sub:T.length+' công việc · '+Object.keys(g).length+' dự án · chỉ '+withEnd+' task có ngày kết thúc thực tế',html:`
  <div class="grid grid-cols-4 gap-4 mb-5">
    ${card('Tổng công việc',T.length,Object.keys(g).length+'/'+P.length+' dự án được theo dõi')}
    ${card('Hoàn thành',done,pc(done/T.length))}
    ${card('Có ngày kết thúc thật',withEnd,pc(withEnd/T.length)+' — điểm nghẽn lớn nhất','v-bad')}
    ${card('Dự án chưa có kế hoạch',P.length-Object.keys(g).length,'hệ thống mới sẽ tự sinh','v-warn')}
  </div>
  <div class="note note-bad mb-5">
    <strong>Điểm nghẽn phát hiện từ dữ liệu:</strong> ${T.length-withEnd}/${T.length} công việc (${pc((T.length-withEnd)/T.length)}) không có ngày kết thúc thực tế.
    Trạng thái hiện do công thức Excel tự suy ra từ ngày tháng, không phải do người xác nhận.
  </div>
  ${Object.entries(g).map(([n,ts])=>`<div class="card mb-3 overflow-hidden">
    <div class="px-4 py-2.5 flex justify-between" style="background:var(--page);border-bottom:1px solid var(--hair)">
    <span class="font-medium text-sm">${n}</span>
    <span class="text-xs muted num">${ts.filter(t=>t.status==='DONE').length}/5 hoàn thành</span></div>
    <table class="w-full text-sm"><tbody>${ts.sort((a,b)=>a.step-b.step).map(t=>`<tr>
    <td class="px-4 py-2 w-8 muted">${t.step}</td><td class="px-4 py-2">${t.name}</td>
    <td class="px-4 py-2 text-xs muted w-24">${t.dept}</td>
    <td class="px-4 py-2 text-xs muted w-56 num">${t.start||'—'} → ${t.planEnd||'—'}</td>
    <td class="px-4 py-2 w-40 text-xs ${t.actualEnd?'muted-2 num':'missing'}">${t.actualEnd||'chưa có ngày KT thật'}</td>
    <td class="px-4 py-2 w-32">${badge(...TS[t.status])}</td></tr>`).join('')}</tbody></table></div>`).join('')}`}};

PAGES.carrier=()=>{
  const byC={},byS={Teldata:0,IBS:0};
  CC.forEach(c=>{byC[c.carrier]=(byC[c.carrier]||0)+1;byS[c.svc==='IBS'?'IBS':'Teldata']++});
  return {sub:CC.length+' hợp đồng khai thác · thay thế 64 cột Excel bằng 1 bảng',html:`
  <div class="grid grid-cols-4 gap-4 mb-5">
    ${card('Tổng hợp đồng',CC.length,'trên '+P.filter(p=>p.carriers.length).length+' dự án')}
    ${card('Teldata',byS.Teldata,'tính theo căn hộ')}
    ${card('IBS',byS.IBS,'tính theo m² sàn')}
    ${card('Có điều khoản',0,'đơn giá, thời hạn, chu kỳ','v-bad')}
  </div>
  <div class="note note-bad mb-5">
    <strong>Rủi ro lớn nhất của dự án:</strong> cả ${CC.length} hợp đồng đều <strong>chưa có đơn giá, thời hạn và chu kỳ thanh toán</strong>.
    Đây là dữ liệu tạo ra 51,4 tỷ doanh thu nhưng không được lưu ở đâu cả. Cần thu thập ngay, không chờ phần mềm.
  </div>
  <div class="card p-3 mb-4 flex gap-3">
    <select id="cc" onchange="rc()" class="ctl"><option value="">Tất cả nhà mạng</option>
    ${Object.keys(byC).sort().map(c=>`<option>${c}</option>`).join('')}</select>
    <select id="cs" onchange="rc()" class="ctl"><option value="">Tất cả dịch vụ</option>
    <option value="TELDATA">Teldata</option><option value="IBS">IBS</option></select>
  </div>
  <div class="card overflow-hidden"><table class="w-full text-sm">
  <thead><tr><th class="text-left px-4 py-2.5">Dự án</th>
  <th class="text-left px-4 py-2.5">Nhà mạng</th><th class="text-left px-4 py-2.5">Dịch vụ</th>
  <th class="text-right px-4 py-2.5">Khối lượng</th><th class="text-left px-4 py-2.5">Đơn giá</th>
  <th class="text-left px-4 py-2.5">Chu kỳ</th><th class="text-left px-4 py-2.5">Hết hạn</th></tr></thead>
  <tbody id="ct"></tbody></table></div>`}};

function rc(){
  const c=document.getElementById('cc').value,s=document.getElementById('cs').value;
  const r=CC.filter(x=>(!c||x.carrier===c)&&(!s||x.svc===s));
  document.getElementById('ct').innerHTML=r.map(x=>`<tr>
  <td class="px-4 py-2.5">${x.project}</td><td class="px-4 py-2.5 font-medium">${x.carrier}</td>
  <td class="px-4 py-2.5">${tag(x.svc,x.svc==='IBS'?C.s7:C.s1)}</td>
  <td class="px-4 py-2.5 text-right">${fmt(x.qty)} ${x.unit}</td>
  <td class="px-4 py-2.5 missing text-xs">chưa có</td><td class="px-4 py-2.5 missing text-xs">chưa có</td>
  <td class="px-4 py-2.5 missing text-xs">chưa có</td></tr>`).join('');
}

PAGES.rev=()=>{
  const wr=P.filter(p=>p.revTotal>0).sort((a,b)=>b.revTotal-a.revTotal);
  return {sub:'FY2025 · '+wr.length+'/'+P.length+' dự án có doanh thu',html:`
  <div class="grid grid-cols-4 gap-4 mb-5">
    ${card('Doanh thu năm',bil(TOTREV),'')}${card('Chi phí năm',bil(TOTCST),'')}
    ${card('Lợi nhuận gộp',bil(TOTREV-TOTCST),'biên '+pc((TOTREV-TOTCST)/TOTREV))}
    ${card('Dự án chưa có doanh thu',P.length-wr.length,pc((P.length-wr.length)/P.length),'v-warn')}
  </div>
  <div class="note note-warn mb-5">
    <strong>Quý 4 cao bất thường:</strong> ${bil(REV[3])} — gấp ${(REV[3]/((REV[0]+REV[1]+REV[2])/3)).toFixed(2)} lần mức trung bình 3 quý đầu.
    Nếu doanh thu thuần túy là phí định kỳ thì các quý phải tương đối đều nhau. Cần xác nhận Q4 có chứa quyết toán cuối năm hay phí một lần không.
  </div>
  <div class="grid grid-cols-2 gap-4 mb-5">
    <div class="card p-5"><h3 class="h3 mb-4">Doanh thu · chi phí · lợi nhuận theo quý</h3><div class="cbox"><canvas id="r1"></canvas></div></div>
    <div class="card p-5"><h3 class="h3 mb-4">Doanh thu theo dự án · top 7</h3><div class="cbox"><canvas id="r2"></canvas></div>
      <div id="r2cap" class="text-[11.5px] muted mt-3"></div></div>
  </div>
  <div class="card overflow-hidden"><table class="w-full text-sm">
  <thead><tr><th class="text-left px-4 py-2.5">Dự án</th>
  <th class="text-right px-4 py-2.5">Q1</th><th class="text-right px-4 py-2.5">Q2</th><th class="text-right px-4 py-2.5">Q3</th>

  ${wr.map(p=>`<tr class="cursor-pointer" onclick="pd('${p.id}')"><td class="px-4 py-2.5">${p.name}</td>
  ${p.rev.map(v=>`<td class="px-4 py-2.5 text-right text-xs muted-2">${fmt(v)}</td>`).join('')}
  <td class="px-4 py-2.5 text-right font-medium">${fmt(p.revTotal)}</td>
  <td class="px-4 py-2.5 text-right muted">${fmt(p.costTotal)}</td>
  <td class="px-4 py-2.5 text-right ${p.revTotal-p.costTotal>=0?'':'v-bad'}">${fmt(p.revTotal-p.costTotal)}</td></tr>`).join('')}
  </tbody></table></div>`}};

PAGES.payback=()=>{
  const wc=P.filter(p=>p.capex).map(p=>({...p,roi:p.revTotal/p.capex})).sort((a,b)=>b.roi-a.roi);
  return {sub:wc.length+'/'+P.length+' dự án đánh giá được hoàn vốn ('+pc(wc.length/P.length)+')',html:`
  <div class="grid grid-cols-4 gap-4 mb-5">

    ${card('Đã hoàn vốn',wc.filter(p=>p.roi>1).length,'','v-good')}

  ${wc.map(p=>`<tr class="cursor-pointer" onclick="pd('${p.id}')"><td class="px-4 py-2.5">${p.name}</td>
  <td class="px-4 py-2.5 text-right muted-2">${fmt(p.capex)}</td><td class="px-4 py-2.5 text-right">${fmt(p.revTotal)}</td>
  <td class="px-4 py-2.5 text-right font-medium ${p.roi>1?'v-good':'v-warn'}">${pc(p.roi)}</td>
  <td class="px-4 py-2.5">${p.roi>1?badge('Đã hoàn vốn',C.good):badge('Chưa hoàn vốn',C.warn)}</td></tr>`).join('')}
  </tbody></table></div>`}};

PAGES.crm=()=>{
  const st=[1,2,3,4].map(s=>O.filter(o=>o.stage===s).length);
  return {sub:O.length+' cơ hội đang theo đuổi · chưa cơ hội nào chuyển thành dự án trong dữ liệu cũ',html:`
  <div class="grid grid-cols-4 gap-4 mb-5">
    ${st.map((n,i)=>card('GĐ'+(i+1)+' · '+STAGE[i+1],n,pc(n/O.length))).join('')}
  </div>
  <div class="note note-warn mb-5">
    <strong>Đứt gãy nghiêm trọng:</strong> so khớp ${O.length} cơ hội này với ${P.length} dự án đã ký, số trùng nhau bằng <strong>0</strong>.
    Khi thắng thầu, dữ liệu bị xóa khỏi pipeline và gõ lại từ đầu ở sheet khác. Vì vậy IDS <strong>không tính được tỷ lệ thắng thầu</strong> —
    chỉ số cốt lõi của mọi hoạt động kinh doanh.
  </div>
  <div class="card overflow-hidden"><table class="w-full text-sm">
  <thead><tr><th class="text-left px-4 py-2.5">Tên dự án</th>
  <th class="text-left px-4 py-2.5">Chủ đầu tư</th><th class="text-left px-4 py-2.5">Khu vực</th>
  <th class="text-left px-4 py-2.5">Đầu mối</th><th class="text-right px-4 py-2.5">Quy mô CH</th>
  <th class="text-left px-4 py-2.5">Giai đoạn</th><th class="text-left px-4 py-2.5">Tương tác cuối</th></tr></thead><tbody>
  ${O.sort((a,b)=>b.stage-a.stage).map(o=>`<tr><td class="px-4 py-2.5">${o.name}${o.feasible?' '+tag('khả thi',C.s3):''}</td>
  <td class="px-4 py-2.5 text-xs muted-2">${(o.investor||'—').slice(0,34)}</td>
  <td class="px-4 py-2.5 muted-2">${o.region||'—'}</td>
  <td class="px-4 py-2.5 text-xs ${o.owner?'muted-2':'missing'}">${o.owner||'chưa gán'}</td>
  <td class="px-4 py-2.5 text-right">${fmt(o.units)}</td>
  <td class="px-4 py-2.5">${badge('GĐ'+o.stage,o.stage>=3?C.s3:o.stage===2?C.s1:C.neutral)}</td>
  <td class="px-4 py-2.5 text-xs ${o.lastDay?'muted num':'missing'}">${o.lastDay||'không ghi nhận'}</td></tr>`).join('')}
  </tbody></table></div>`}};

PAGES.quality=()=>{
  const noCode=P.filter(p=>!p.code).length, conflict=P.filter(p=>p.conflict).length;
  const noCapex=P.filter(p=>!p.capex).length, noTask=P.length-new Set(T.map(t=>t.pkey)).size;
  const noEnd=T.filter(t=>!t.actualEnd).length, noOwner=O.filter(o=>!o.owner).length, noLast=O.filter(o=>!o.lastDay).length;
  const rows=[
    ['Dự án thiếu mã DA',noCode,P.length,'Mã sinh tự động, ràng buộc duy nhất ở tầng CSDL'],
    ['Dự án có dữ liệu từ nhiều sheet',conflict,P.length,'Hợp nhất thành một bản ghi duy nhất'],
    ['Dự án thiếu Tổng CPĐT',noCapex,P.length,'Bắt buộc nhập tại bước duyệt đầu tư'],
    ['Dự án chưa có kế hoạch triển khai',noTask,P.length,'Tự sinh 5 task khi dự án được duyệt'],
    ['Công việc thiếu ngày kết thúc thật',noEnd,T.length,'Ràng buộc CHECK chặn đóng task nếu thiếu'],
    ['Hợp đồng nhà mạng thiếu điều khoản',CC.length,CC.length,'Bảng carrier_contract_terms — cần thu thập'],
    ['Cơ hội chưa gán người phụ trách',noOwner,O.length,'Bắt buộc owner_id khi tạo cơ hội'],
    ['Cơ hội không ghi nhận tương tác cuối',noLast,O.length,'Tự cập nhật từ nhật ký tiếp xúc'],
  ];
  return {sub:'Đối chiếu dữ liệu Excel hiện tại với ràng buộc của hệ thống mới',html:`
  <div class="card overflow-hidden"><table class="w-full text-sm">
  <thead><tr><th class="text-left px-4 py-3">Vấn đề phát hiện</th>
  <th class="text-right px-4 py-3">Số lượng</th><th class="text-left px-4 py-3 w-64">Mức độ</th>
  <th class="text-left px-4 py-3">Cách hệ thống mới xử lý</th></tr></thead><tbody>
  ${rows.map(([l,n,t,f])=>{const r=n/t;const sc=r>0.5?C.critical:r>0.2?C.warn:C.good;
  return `<tr><td class="px-4 py-3 font-medium">${l}</td>
  <td class="px-4 py-3 text-right ${r>0.5?'v-bad font-semibold':r>0.2?'v-warn':'muted-2'}">${n} / ${t}</td>
  <td class="px-4 py-3"><div class="flex items-center gap-2.5"><div class="flex-1 meter">
  <div style="width:${(r*100).toFixed(0)}%;background:${sc}"></div></div>
  <span class="text-xs w-11 text-right num muted-2">${pc(r)}</span></div></td>
  <td class="px-4 py-3 text-xs muted-2">${f}</td></tr>`}).join('')}</tbody></table></div>
  <div class="mt-5 dark-panel p-5 text-sm leading-relaxed">
    <div class="font-semibold mb-2">Ba việc nên bắt đầu ngay, không chờ phần mềm</div>
    <div class="space-y-1.5 dim">
      <div>1. Thu thập điều khoản ${CC.length} hợp đồng nhà mạng — đơn giá, thời hạn, chu kỳ thanh toán. Đây là đường găng dài nhất.</div>
      <div>2. Bổ sung Tổng CPĐT cho ${noCapex} dự án còn thiếu — do Kế toán cung cấp.</div>
      <div>3. Chốt nguồn chuẩn cho ${conflict} dự án có dữ liệu xung đột giữa các sheet.</div>
    </div>
  </div>`}};

/* ---- mặc định chung cho Chart.js: chữ, lưới, chú giải, tooltip ----
   Bọc try/catch để nếu CDN Chart.js không tải được thì phần bảng biểu vẫn chạy bình thường. */
try{
  Chart.defaults.font.family="system-ui,-apple-system,'Segoe UI',sans-serif";
  Chart.defaults.font.size=11;
  Chart.defaults.color=C.ink3;
  Chart.defaults.borderColor=C.grid;
  Object.assign(Chart.defaults.plugins.legend.labels,
    {usePointStyle:true,pointStyle:'circle',boxWidth:7,boxHeight:7,padding:16,color:C.ink2,font:{size:11.5}});
  Object.assign(Chart.defaults.plugins.tooltip,
    {backgroundColor:C.ink,titleColor:'#fff',bodyColor:'#e6e5e0',borderWidth:0,
     padding:10,cornerRadius:7,usePointStyle:true,boxPadding:5,displayColors:true,
     titleFont:{size:11.5,weight:'600'},bodyFont:{size:11.5}});
}catch(err){console.warn('Không nạp được Chart.js:',err.message)}

function draw(p){
  const el=id=>document.getElementById(id);
  // trục tiền: lưới ngang mảnh, bỏ viền trục, nhãn "x.x tỷ"
  const money=v=>(v/1e9).toFixed(1)+' tỷ';
  const yMoney=()=>({grid:{color:C.grid,drawTicks:false},border:{display:false},
                     ticks:{padding:8,callback:money}});
  const xCat  =()=>({grid:{display:false},border:{display:false},ticks:{padding:6}});
  // doanh thu = series-1, chi phí = trung tính (vai lùi), lợi nhuận = series-2
  const OPT=()=>({responsive:true,maintainAspectRatio:false,
    interaction:{mode:'index',intersect:false},
    plugins:{legend:{position:'bottom',align:'center'},
             tooltip:{callbacks:{label:c=>' '+c.dataset.label+': '+fmt(c.parsed.y)}}},
    scales:{y:yMoney(),x:xCat()}});
  const BAR={borderRadius:4,borderSkipped:'bottom',barPercentage:.9,categoryPercentage:.6};
  const HBAR={borderRadius:4,borderSkipped:'left',barPercentage:.85,categoryPercentage:.78};
  try{
  if(p==='dash'){
    if(!el('c1'))return;
    charts.push(new Chart(el('c1'),{type:'bar',data:{labels:['Q1','Q2','Q3','Q4'],datasets:[
      {label:'Doanh thu',data:REV,backgroundColor:C.s1,...BAR},
      {label:'Chi phí',data:CST,backgroundColor:C.neutral,...BAR}]},options:OPT()}));
    const sc=Object.keys(ST).map(k=>P.filter(x=>x.status===k).length);
    charts.push(new Chart(el('c2'),{type:'doughnut',
      data:{labels:Object.values(ST).map(v=>v[0]),datasets:[{data:sc,
      backgroundColor:Object.values(ST).map(v=>v[1]),  // cùng nguồn màu với chấm trạng thái trong bảng
      borderColor:C.surface,borderWidth:2,hoverOffset:6}]},
      options:{responsive:true,maintainAspectRatio:false,cutout:'64%',
        plugins:{legend:{position:'bottom'},
                 tooltip:{callbacks:{label:c=>' '+c.label+': '+c.parsed+' dự án'}}}}}));
    const t8=P.filter(x=>x.revTotal>0).sort((a,b)=>b.revTotal-a.revTotal).slice(0,8);
    charts.push(new Chart(el('c3'),{type:'bar',
      data:{labels:t8.map(x=>x.name.slice(0,20)),
            datasets:[{label:'Doanh thu',data:t8.map(x=>x.revTotal),backgroundColor:C.s1,...HBAR}]},
      options:{indexAxis:'y',responsive:true,maintainAspectRatio:false,
        plugins:{legend:{display:false},tooltip:{callbacks:{label:c=>' '+fmt(c.parsed.x)}}},
        scales:{x:{grid:{color:C.grid,drawTicks:false},border:{display:false},ticks:{padding:8,callback:money}},
                y:{grid:{display:false},border:{display:false},ticks:{padding:6}}}}}));
    const bc={};CC.forEach(c=>bc[c.carrier]=(bc[c.carrier]||0)+1);
    const e=Object.entries(bc).sort((a,b)=>b[1]-a[1]);
    charts.push(new Chart(el('c4'),{type:'bar',
      data:{labels:e.map(x=>x[0]),datasets:[{label:'Số hợp đồng',data:e.map(x=>x[1]),backgroundColor:C.s2,...BAR}]},
      options:{responsive:true,maintainAspectRatio:false,
        plugins:{legend:{display:false},tooltip:{callbacks:{label:c=>' '+c.parsed.y+' hợp đồng'}}},
        scales:{y:{grid:{color:C.grid,drawTicks:false},border:{display:false},ticks:{padding:8}},x:xCat()}}}));
  }
  if(p==='rev'){
    if(!el('r1'))return;
    charts.push(new Chart(el('r1'),{type:'bar',data:{labels:['Q1','Q2','Q3','Q4'],datasets:[
      {label:'Doanh thu',data:REV,backgroundColor:C.s1,...BAR},
      {label:'Chi phí',data:CST,backgroundColor:C.neutral,...BAR},
      {label:'Lợi nhuận',type:'line',data:REV.map((v,i)=>v-CST[i]),
       borderColor:C.s2,backgroundColor:C.s2,borderWidth:2,tension:.35,
       pointRadius:4,pointHoverRadius:6,pointBackgroundColor:C.s2,
       pointBorderColor:C.surface,pointBorderWidth:2}]},options:OPT()}));
    // Trước đây là donut 8 lát — 8 màu cạnh nhau không thể phân biệt chắc chắn.
    // Bar ngang đọc được thứ hạng ngay và chỉ cần một màu.
    // Phần "còn lại" không vẽ thành thanh: gộp 26 dự án lại thì nó dài gấp 3 lần
    // thanh lớn nhất và nén toàn bộ top 7 — con số đó đưa xuống nhãn dưới biểu đồ.
    const t=P.filter(x=>x.revTotal>0).sort((a,b)=>b.revTotal-a.revTotal);
    const top=t.slice(0,7), rest=t.slice(7).reduce((s,x)=>s+x.revTotal,0);
    const share=top.reduce((s,x)=>s+x.revTotal,0)/(TOTREV||1);
    const cap=el('r2cap'); if(cap)cap.textContent=
      '7 dự án này chiếm '+pc(share)+' tổng doanh thu · '+(t.length-7)+' dự án còn lại '+bil(rest)+' ('+pc(1-share)+')';
    charts.push(new Chart(el('r2'),{type:'bar',
      data:{labels:top.map(x=>x.name.slice(0,22)),
            datasets:[{label:'Doanh thu',data:top.map(x=>x.revTotal),backgroundColor:C.s1,...HBAR}]},
      options:{indexAxis:'y',responsive:true,maintainAspectRatio:false,
        plugins:{legend:{display:false},tooltip:{callbacks:{label:c=>' '+fmt(c.parsed.x)}}},
        scales:{x:{grid:{color:C.grid,drawTicks:false},border:{display:false},ticks:{padding:8,callback:money}},
                y:{grid:{display:false},border:{display:false},ticks:{padding:6,font:{size:10.5}}}}}}));
  }
  }catch(err){console.warn('Bỏ qua vẽ biểu đồ:',err.message)}
}
function go(p){
  destroy();
  document.querySelectorAll('.nav-item').forEach(n=>n.classList.toggle('active',n.dataset.p===p));
  const r=PAGES[p]();
  document.getElementById('ttl').textContent=document.querySelector(`[data-p="${p}"]`).textContent;
  document.getElementById('sub').textContent=r.sub||'';
  document.getElementById('body').innerHTML=r.html;
  if(p==='proj')rp(); if(p==='carrier')rc();
  setTimeout(()=>draw(p),30);
}
document.getElementById('nav').addEventListener('click',e=>{const a=e.target.closest('.nav-item');if(a)go(a.dataset.p)});
go('dash');
</script>
</body></html>
