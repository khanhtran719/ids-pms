name: ids-pms-uat

x-api-environment: &api-environment
  NODE_ENV: production
  API_PORT: 3000
  WEB_ORIGIN: ${WEB_ORIGIN:?WEB_ORIGIN is required}
  MONGODB_URI: mongodb://mongodb:27017/${MONGODB_DATABASE:?MONGODB_DATABASE is required}?replicaSet=rs0&directConnection=true
  FILE_STORAGE_ROOT: /app/storage/uploads
  MAX_UPLOAD_SIZE_MB: ${MAX_UPLOAD_SIZE_MB:-20}
  JSON_BODY_LIMIT: ${JSON_BODY_LIMIT:-100kb}
  URLENCODED_PARAMETER_LIMIT: ${URLENCODED_PARAMETER_LIMIT:-100}
  ENABLE_SWAGGER: ${ENABLE_SWAGGER:-false}
  THROTTLE_TTL_MS: ${THROTTLE_TTL_MS:-60000}
  THROTTLE_LIMIT: ${THROTTLE_LIMIT:-120}
  TRUST_PROXY_HOPS: ${TRUST_PROXY_HOPS:-1}
  JWT_ACCESS_SECRET: ${JWT_ACCESS_SECRET:?JWT_ACCESS_SECRET is required}
  ACCESS_TOKEN_TTL_SECONDS: ${ACCESS_TOKEN_TTL_SECONDS:-900}
  REFRESH_TOKEN_TTL_DAYS: ${REFRESH_TOKEN_TTL_DAYS:-30}
  AUTH_COOKIE_SECURE: ${AUTH_COOKIE_SECURE:-true}
  SEED_ADMIN_EMAIL: ${SEED_ADMIN_EMAIL:?SEED_ADMIN_EMAIL is required}
  SEED_ADMIN_PASSWORD: ${SEED_ADMIN_PASSWORD:?SEED_ADMIN_PASSWORD is required}
  SEED_ADMIN_DISPLAY_NAME: ${SEED_ADMIN_DISPLAY_NAME:-UAT Administrator}

services:
  mongodb:
    image: mongo:8.0
    command: ['mongod', '--replSet', 'rs0', '--bind_ip_all']
    volumes:
      - mongodb-uat-data:/data/db
    healthcheck:
      test:
        [
          'CMD-SHELL',
          'echo ''try { rs.status().ok } catch (error) { rs.initiate({_id: "rs0", members: [{_id: 0, host: "mongodb:27017"}]}).ok }'' | mongosh --port 27017 --quiet',
        ]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 10s
    restart: unless-stopped
    networks:
      - data
    security_opt:
      - no-new-privileges:true

  api:
    image: ids-pms-api:uat
    build:
      context: .
      dockerfile: docker/api.Dockerfile
    environment: *api-environment
    depends_on:
      mongodb:
        condition: service_healthy
    volumes:
      - uploads-uat-data:/app/storage/uploads
    healthcheck:
      test:
        [
          'CMD',
          'node',
          '-e',
          "fetch('http://127.0.0.1:3000/api/v1/health/ready').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))",
        ]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 15s
    restart: unless-stopped
    networks:
      - backend
      - data
    security_opt:
      - no-new-privileges:true

  web:
    image: ids-pms-web:uat
    build:
      context: .
      dockerfile: docker/web.Dockerfile
    depends_on:
      api:
        condition: service_healthy
    ports:
      - '${UAT_HTTP_PORT:-8080}:80'
    healthcheck:
      test: ['CMD', 'wget', '-qO-', 'http://127.0.0.1/healthz']
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 10s
    restart: unless-stopped
    networks:
      - edge
      - backend
    security_opt:
      - no-new-privileges:true

  demo-seed:
    image: ids-pms-api:uat
    profiles: ['tools']
    command: ['node', 'tools/demo-seed/seed-demo.mjs']
    environment:
      <<: *api-environment
      DEMO_SEED_CONFIRM: ${DEMO_SEED_CONFIRM:?DEMO_SEED_CONFIRM is required}
    depends_on:
      api:
        condition: service_healthy
    restart: 'no'
    networks:
      - data
    security_opt:
      - no-new-privileges:true

volumes:
  mongodb-uat-data:
  uploads-uat-data:

networks:
  edge:
  backend:
    internal: true
  data:
    internal: true
